<section class="history-section">
  <article class="panel history-panel">
    <div class="panel-header">
      <div>
        <p class="eyebrow">Histórico</p>
        <h3>Resumen por tiempo desde Redis o memoria</h3>
      </div>
      <div class="history-controls" role="group" aria-label="Selector de histórico">
        <button
          *ngFor="let bucket of buckets; let first = first"
          class="history-toggle"
          [class.is-active]="first"
          type="button"
          [attr.data-bucket]="bucket.id"
        >
          {{ bucket.label }}
        </button>
      </div>
    </div>
    <p class="history-note" id="history-note">Cargando histórico...</p>
    <div class="availability-panel">
      <div class="availability-header">
        <div>
          <p class="eyebrow">Availability</p>
          <h3>Estado del servicio en el tiempo</h3>
        </div>
        <div class="availability-legend" aria-label="Leyenda de disponibilidad">
          <span class="availability-chip online">Online</span>
          <span class="availability-chip degraded">Degraded</span>
          <span class="availability-chip offline">Offline</span>
        </div>
      </div>
      <div class="availability-stats row g-3">
        <div class="availability-stat col-12 col-md-4">
          <span class="availability-label">Disponibilidad media</span>
          <strong id="availability-average">--%</strong>
          <p id="availability-average-note">Esperando puntos</p>
        </div>
        <div class="availability-stat col-12 col-md-4">
          <span class="availability-label">Tiempo caído</span>
          <strong id="availability-downtime">--</strong>
          <p id="availability-downtime-note">Sin historial</p>
        </div>
        <div class="availability-stat col-12 col-md-4">
          <span class="availability-label">Estado actual</span>
          <strong id="availability-current">--</strong>
          <p id="availability-current-note">Sin snapshot</p>
        </div>
      </div>
      <div class="availability-timeline" id="availability-timeline" aria-label="Línea temporal de disponibilidad"></div>
    </div>
    <svg id="history-chart" class="history-chart" viewBox="0 0 1200 360" preserveAspectRatio="none" aria-label="Gráfico de carga histórica">
      <defs>
        <linearGradient id="cpu-gradient" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#facc15" stop-opacity="0.55"></stop>
          <stop offset="100%" stop-color="#facc15" stop-opacity="0.03"></stop>
        </linearGradient>
        <linearGradient id="mem-gradient" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"></stop>
          <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.03"></stop>
        </linearGradient>
      </defs>
      <g id="history-grid" class="history-grid"></g>
      <path id="cpu-area" class="history-area cpu" d=""></path>
      <path id="memory-area" class="history-area memory" d=""></path>
      <polyline id="cpu-line" class="history-line cpu" points=""></polyline>
      <polyline id="memory-line" class="history-line memory" points=""></polyline>
      <g id="history-points"></g>
      <g id="history-labels"></g>
    </svg>
    <div class="history-summary row g-3" id="history-summary"></div>
  </article>
</section>
